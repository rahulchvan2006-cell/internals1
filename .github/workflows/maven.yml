name: Maven Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    # -----------------------------------------------------------------
    # Docker Build & Push (Runs after successful compile & test pass)
    # -----------------------------------------------------------------
    - name: Set up Docker Buildx
      if: success() && github.event_name == 'push'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: success() && github.event_name == 'push' && env.DOCKER_USERNAME != ''
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      if: success() && github.event_name == 'push' && env.DOCKER_USERNAME != ''
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-calculator:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/student-grade-calculator:${{ github.sha }}
